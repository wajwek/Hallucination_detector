[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hallucination-detector"
version = "0.1.0"
description = "Modular RAG hallucination detector (geometric methods) with caching + Streamlit GUI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Hallucination Detector Contributors" }]

dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "pydantic>=2.6",
  "typer>=0.12",
  "rich>=13.7",
  "streamlit>=1.33",
  "sentence-transformers>=2.6",
  "joblib>=1.3",
  "plotly>=5.20",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
]

[project.scripts]
hd = "hd.cli:app"

[tool.setuptools]

[tool.setuptools.packages.find]
where = ["."]
include = ["hd*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
